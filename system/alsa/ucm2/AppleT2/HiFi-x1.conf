# Device numbers verified against /proc/asound/pcm on Macmini8,1.
SectionVerb {
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal Speaker"
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 1
        PlaybackRate 48000
    }
}

SectionDevice."Headphones" {
    Comment "External Speakers / Headphones"
    ConflictingDevice [
        "Speaker"
    ]
    Value {
        PlaybackPriority 300
        PlaybackPCM "hw:${CardId},2"
        PlaybackChannels 2
        PlaybackRate 48000
        JackControl "Codec Output Jack"
    }
}

SectionDevice."Headset" {
    Comment "Headset Microphone"
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},3"
        CaptureChannels 1
        CaptureRate 48000
        JackControl "Codec Output Jack"
    }
}
