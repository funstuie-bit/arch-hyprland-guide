# Foot terminal configuration
# Fast, lightweight Wayland-native terminal emulator

font=JetBrainsMono Nerd Font:size=13
pad=12x12
initial-window-size-chars=100x28

[cursor]
style=beam
blink=yes

[key-bindings]
# Universal Mac & Linux clipboard bindings (no more Ctrl+Shift+V friction!)
clipboard-copy=Control+Shift+c XF86Copy Mod4+c
clipboard-paste=Control+Shift+v XF86Paste Mod4+v Control+v

[colors-dark]
alpha=0.95
foreground=cdd6f4
background=1e1e2e

## Normal / Regular colors (Catppuccin Mocha palette)
regular0=45475a   # Black (surface1)
regular1=f38ba8   # Red
regular2=a6e3a1   # Green
regular3=f9e2af   # Yellow
regular4=89b4fa   # Blue
regular5=f5c2e7   # Magenta (pink)
regular6=94e2d5   # Cyan (teal)
regular7=bac2de   # White (subtext1)

## Bright colors
bright0=585b70    # Bright Black (surface2)
bright1=f38ba8    # Bright Red
bright2=a6e3a1    # Bright Green
bright3=f9e2af    # Bright Yellow
bright4=89b4fa    # Bright Blue
bright5=f5c2e7    # Bright Magenta
bright6=94e2d5    # Bright Cyan
bright7=a6adc8    # Bright White (subtext0)

[mouse]
hide-when-typing=yes
