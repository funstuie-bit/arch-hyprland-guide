# Independent Arch window controls, matching Omarchy's core navigation.
# No Omarchy packages or scripts required. See docs/window-controls.md.
# Keep local overrides in a separate file sourced AFTER this file if desired.

bindd = SUPER ALT, Space, Desktop control menu, exec, ~/.config/hypr/bin/window-controls.sh menu
bindd = SUPER CTRL SHIFT, Space, Choose desktop theme, exec, ~/.local/bin/desktop-settings --page appearance
bindd = SUPER CTRL, Space, Choose wallpaper, exec, ~/.local/bin/desktop-settings --page wallpaper
bindd = SUPER CTRL, A, Sound controls, exec, pavucontrol
bindd = SUPER CTRL, B, Bluetooth controls, exec, blueman-manager
bindd = SUPER CTRL, W, Wi-Fi controls, exec, foot -T "Network Setup" -e nmtui

bindd = SUPER, P, Toggle pseudo tiling, pseudo,
bindd = SUPER ALT, F, Maximize while keeping application tabs, fullscreen, 1
bindd = SUPER CTRL, F, Toggle application fullscreen inside its tile, exec, ~/.config/hypr/bin/window-controls.sh tiled-fullscreen
bindd = SUPER, O, Toggle floating and pinned across workspaces, exec, ~/.config/hypr/bin/window-controls.sh pop

# Directional swaps: changing position is separate from floating or splitting.
bindd = SUPER SHIFT, left, Swap window left, swapwindow, l
bindd = SUPER SHIFT, right, Swap window right, swapwindow, r
bindd = SUPER SHIFT, up, Swap window up, swapwindow, u
bindd = SUPER SHIFT, down, Swap window down, swapwindow, d

# US keyboard physical minus and equals keys, like the upstream defaults.
# Repeat while held. In tiling these move shared dividers, not independent edges.
binded = SUPER, code:20, Resize width minus 100 px, resizeactive, -100 0
binded = SUPER, code:21, Resize width plus 100 px, resizeactive, 100 0
binded = SUPER SHIFT, code:20, Resize height minus 100 px, resizeactive, 0 -100
binded = SUPER SHIFT, code:21, Resize height plus 100 px, resizeactive, 0 100
binded = SUPER ALT, code:20, Resize width minus 25 px, resizeactive, -25 0
binded = SUPER ALT, code:21, Resize width plus 25 px, resizeactive, 25 0
binded = SUPER SHIFT ALT, code:20, Resize height minus 25 px, resizeactive, 0 -25
binded = SUPER SHIFT ALT, code:21, Resize height plus 25 px, resizeactive, 0 25
binded = SUPER CTRL, code:20, Resize width minus 300 px, resizeactive, -300 0
binded = SUPER CTRL, code:21, Resize width plus 300 px, resizeactive, 300 0
binded = SUPER CTRL SHIFT, code:20, Resize height minus 300 px, resizeactive, 0 -300
binded = SUPER CTRL SHIFT, code:21, Resize height plus 300 px, resizeactive, 0 300

bindd = SUPER, Tab, Next occupied workspace, workspace, e+1
bindd = SUPER SHIFT, Tab, Previous occupied workspace, workspace, e-1
bindd = SUPER CTRL, Tab, Former workspace, workspace, previous
bindd = ALT SHIFT, Tab, Previous window, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,
bindd = CTRL ALT, Tab, Next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, Tab, Previous monitor, focusmonitor, -1

bindd = SUPER SHIFT ALT, 1, Send window to workspace 1 without following, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, 2, Send window to workspace 2 without following, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, 3, Send window to workspace 3 without following, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, 4, Send window to workspace 4 without following, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, 5, Send window to workspace 5 without following, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, 6, Send window to workspace 6 without following, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, 7, Send window to workspace 7 without following, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, 8, Send window to workspace 8 without following, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, 9, Send window to workspace 9 without following, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, 0, Send window to workspace 10 without following, movetoworkspacesilent, 10
bindd = SUPER SHIFT ALT, left, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, right, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, up, Move workspace to upper monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, down, Move workspace to lower monitor, movecurrentworkspacetomonitor, d

bindd = SUPER, S, Show or hide scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Send window to scratchpad without following, movetoworkspacesilent, special:scratchpad
bindd = SUPER, grave, Show or hide scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER SHIFT, grave, Send window to scratchpad without following, movetoworkspacesilent, special:scratchpad

bindd = SUPER ALT, left, Move window into group on left, moveintogroup, l
bindd = SUPER ALT, right, Move window into group on right, moveintogroup, r
bindd = SUPER ALT, up, Move window into group above, moveintogroup, u
bindd = SUPER ALT, down, Move window into group below, moveintogroup, d
bindd = SUPER ALT, Tab, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, Tab, Previous window in group, changegroupactive, b
bindd = SUPER CTRL, left, Previous window in group, changegroupactive, b
bindd = SUPER CTRL, right, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b
bindd = SUPER ALT, 1, Focus first window in group, changegroupactive, 1
bindd = SUPER ALT, 2, Focus second window in group, changegroupactive, 2
bindd = SUPER ALT, 3, Focus third window in group, changegroupactive, 3
bindd = SUPER ALT, 4, Focus fourth window in group, changegroupactive, 4
bindd = SUPER ALT, 5, Focus fifth window in group, changegroupactive, 5
