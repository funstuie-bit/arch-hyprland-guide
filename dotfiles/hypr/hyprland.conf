# ##############################################################################
# Hyprland Configuration - Mouse-Friendly & Lightweight
# Designed for Arch Linux on 2018 Mac mini (T2 / Intel UHD 630)
# ##############################################################################

# -----------------------------------------------------------------------------
# 1. MONITORS
# -----------------------------------------------------------------------------
# See https://wiki.hyprland.org/Configuring/Monitors/
# Auto-detect any monitor with preferred resolution and refresh rate:
monitor = , preferred, auto, 1

# If using a 4K display and wanting 1.5x or 2x UI scaling, uncomment below:
# monitor = , 3840x2160@60, auto, 1.5


# -----------------------------------------------------------------------------
# 2. DEFAULT PROGRAMS
# -----------------------------------------------------------------------------
$terminal    = foot
$fileManager = thunar
$menu        = rofi -show drun -show-icons


# -----------------------------------------------------------------------------
# 3. AUTOSTART
# -----------------------------------------------------------------------------
# Polkit authentication agent (for GUI sudo prompts)
exec-once = hyprpolkitagent || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Status bar & notifications
exec-once = waybar
exec-once = mako

# Wallpaper daemon
exec-once = hyprpaper

# Applets (system tray)
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Background crash watcher (notifies and offers 1-click AI diagnosis on crash)
exec-once = ~/.config/hypr/bin/crash-watch.sh &

# XDG Desktop Portal integration for screen sharing / file dialogs
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


# -----------------------------------------------------------------------------
# 4. ENVIRONMENT VARIABLES
# -----------------------------------------------------------------------------
# Intel UHD 630 Wayland drivers
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland


# -----------------------------------------------------------------------------
# 5. INPUT & MOUSE BEHAVIOR
# -----------------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # 1: Window focus follows mouse movement
    # 2: Window focus follows mouse, click focuses window
    follow_mouse = 1

    # Mouse sensitivity (-1.0 to 1.0)
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# Cursor settings - PREVENTS cursor from snapping/warping away from mouse
cursor {
    no_warps = true
    inactive_timeout = 0
}


# -----------------------------------------------------------------------------
# 6. GENERAL LOOK & MOUSE RESIZE SETTINGS
# -----------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # CRITICAL FOR MOUSE USERS:
    # Resize windows by grabbing the border with the cursor (no keys required!)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    layout = dwindle
    allow_tearing = false
}


# -----------------------------------------------------------------------------
# 7. DECORATION & ANIMATIONS
# -----------------------------------------------------------------------------
decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}


# -----------------------------------------------------------------------------
# 8. WINDOW RULES (Floating & Dialogs)
# -----------------------------------------------------------------------------
# Float dialogs, media managers, and settings panels automatically
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress|Confirm to replace files)

# Set comfortable default sizes and center dialogs
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = size 600 450, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# Floating windows for Cliamp, AI Agent, and Crash Diagnostics
windowrulev2 = float, class:^(foot)$, title:^(Cliamp)$
windowrulev2 = size 780 520, class:^(foot)$, title:^(Cliamp)$
windowrulev2 = center, class:^(foot)$, title:^(Cliamp)$

windowrulev2 = float, class:^(foot)$, title:^(Crash Diagnosis:.*)$
windowrulev2 = size 850 650, class:^(foot)$, title:^(Crash Diagnosis:.*)$
windowrulev2 = center, class:^(foot)$, title:^(Crash Diagnosis:.*)$

windowrulev2 = float, class:^(foot)$, title:^(AI Agent.*)$
windowrulev2 = size 900 650, class:^(foot)$, title:^(AI Agent.*)$
windowrulev2 = center, class:^(foot)$, title:^(AI Agent.*)$

windowrulev2 = float, class:^(foot)$, title:^(Activity Monitor \(btop\))$
windowrulev2 = size 950 650, class:^(foot)$, title:^(Activity Monitor \(btop\))$
windowrulev2 = center, class:^(foot)$, title:^(Activity Monitor \(btop\))$

windowrulev2 = float, class:^(localsend)$
windowrulev2 = float, class:^(gnome-disks)$
windowrulev2 = float, class:^(imv)$



# -----------------------------------------------------------------------------
# 9. KEY & MOUSE BINDINGS
# -----------------------------------------------------------------------------
# Main Modifier Key (Super / Command / Windows key)
$mainMod = SUPER

# --- Applications & Basics ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space,  exec, $menu
bind = $mainMod, B,      exec, xdg-open http:// || firefox || chromium || zen-browser
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod SHIFT, O, exec, obsidian
bind = $mainMod CTRL, T, exec, foot -T "Activity Monitor (btop)" -e btop
bind = $mainMod, Q,      killactive,
bind = $mainMod, F,      fullscreen, 0
bind = $mainMod, V,      togglefloating,
bind = $mainMod, L,      exec, hyprlock
bind = $mainMod SHIFT, Q, exit,

# --- Cheatsheet & AI Agent Shortcuts ---
bind = $mainMod, K,      exec, ~/.config/hypr/bin/shortcuts-menu.sh
bind = $mainMod SHIFT, A, exec, ~/.config/hypr/bin/default-agent.sh --launch
bind = $mainMod ALT, A,   exec, ~/.config/hypr/bin/default-agent.sh --pick

# --- Music Player (Cliamp) ---
bind = $mainMod, M,      exec, foot -T "Cliamp" -e cliamp
bind = $mainMod SHIFT ALT, M, exec, foot -T "Cliamp" -e cliamp

# --- Screenshots ---
# Super + Shift + S: Select area with mouse and copy to clipboard
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# PrintScreen: Save full screenshot to ~/Pictures/Screenshots
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# --- Volume & Media Controls (Mac keyboard compatible) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# --- Keyboard Window Focus Navigation ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# --- Workspaces 1-10 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- MOUSE CONTROLS ---
# Super + Left Click Drag = Move window
bindm = $mainMod, mouse:272, movewindow

# Super + Right Click Drag = Resize window
bindm = $mainMod, mouse:273, resizewindow

# Super + Middle Click = Toggle floating
bind = $mainMod, mouse:274, togglefloating

# Super + Scroll Wheel = Switch workspaces back and forth
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
