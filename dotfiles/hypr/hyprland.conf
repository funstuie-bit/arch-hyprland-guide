# ##############################################################################
# Hyprland Configuration - Omarchy Look & Feel
# Designed for Arch Linux on 2018 Mac mini (T2 / Intel UHD 630)
# ##############################################################################

# -----------------------------------------------------------------------------
# 1. MONITORS
# -----------------------------------------------------------------------------
# Dell U4021QW 40" 5K2K Ultrawide:
# DP-1 is the direct Thunderbolt 3 connection:
monitor = DP-1, 2560x1080@60, 0x0, 1

# DP-3 is the HDMI / USB-C adapter connection (mirrored at 0x0):
monitor = DP-3, 2560x1080@60, 0x0, 1

# Fallback auto-detection for any other monitor:
monitor = , preferred, auto, 1


# -----------------------------------------------------------------------------
# 2. DEFAULT PROGRAMS
# -----------------------------------------------------------------------------
$terminal    = foot
$fileManager = thunar
$menu        = rofi -show drun -show-icons


# -----------------------------------------------------------------------------
# 3. AUTOSTART
# -----------------------------------------------------------------------------
# Polkit authentication agent (for GUI sudo prompts)
exec-once = hyprpolkitagent || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Status bar & notifications
exec-once = waybar
exec-once = mako

# Wallpaper daemon
exec-once = hyprpaper

# Applets (system tray)
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Clipboard manager daemons (cliphist)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Background crash watcher
exec-once = ~/.config/hypr/bin/crash-watch.sh &

# XDG Desktop Portal integration for screen sharing / file dialogs
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


# -----------------------------------------------------------------------------
# 4. ENVIRONMENT VARIABLES
# -----------------------------------------------------------------------------
# Intel UHD 630 / Aquamarine DRM modifier fix (prevents comb/sawtooth artifacts)
env = AQ_NO_MODIFIERS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland


# -----------------------------------------------------------------------------
# 5. INPUT & MOUSE BEHAVIOR
# -----------------------------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # 1: Window focus follows mouse movement
    follow_mouse = 1

    # Mouse sensitivity (-1.0 to 1.0)
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# Cursor settings - PREVENTS cursor from snapping/warping away from mouse
cursor {
    no_warps = true
    inactive_timeout = 0
    no_hardware_cursors = true
}


# -----------------------------------------------------------------------------
# 6. GENERAL LOOK & MOUSE RESIZE SETTINGS (Omarchy Aesthetic)
# -----------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Clean Omarchy / Catppuccin lavender-blue gradient
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)

    # Resize windows by grabbing the border with the cursor
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    layout = dwindle
    allow_tearing = false
}

# -----------------------------------------------------------------------------
# Clean Screen & Suppress Popups
# -----------------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}


# -----------------------------------------------------------------------------
# 7. DECORATION & ANIMATIONS
# -----------------------------------------------------------------------------
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(11111bee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

dwindle {
    preserve_split = true
}


# -----------------------------------------------------------------------------
# 8. WINDOW RULES (Floating & Dialogs)
# -----------------------------------------------------------------------------
# Float dialogs, media managers, and settings panels automatically
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(file-roller)$
windowrule = float 1, match:class ^(thunar)$, match:title ^(File Operation Progress|Confirm to replace files)

# Set comfortable default sizes and center dialogs
windowrule = size 700 500, match:class ^(pavucontrol)$
windowrule = center 1, match:class ^(pavucontrol)$
windowrule = size 600 450, match:class ^(blueman-manager)$
windowrule = center 1, match:class ^(blueman-manager)$

# Floating windows for Cliamp, AI Agent, and Crash Diagnostics
windowrule = float 1, match:class ^(foot)$, match:title ^(Cliamp)$
windowrule = size 780 520, match:class ^(foot)$, match:title ^(Cliamp)$
windowrule = center 1, match:class ^(foot)$, match:title ^(Cliamp)$

windowrule = float 1, match:class ^(foot)$, match:title ^(Crash Diagnosis:.*)$
windowrule = size 850 650, match:class ^(foot)$, match:title ^(Crash Diagnosis:.*)$
windowrule = center 1, match:class ^(foot)$, match:title ^(Crash Diagnosis:.*)$

windowrule = float 1, match:class ^(foot)$, match:title ^(AI Agent.*)$
windowrule = size 900 650, match:class ^(foot)$, match:title ^(AI Agent.*)$
windowrule = center 1, match:class ^(foot)$, match:title ^(AI Agent.*)$

windowrule = float 1, match:class ^(foot)$, match:title ^(Activity Monitor \(btop\))$
windowrule = size 950 650, match:class ^(foot)$, match:title ^(Activity Monitor \(btop\))$
windowrule = center 1, match:class ^(foot)$, match:title ^(Activity Monitor \(btop\))$

windowrule = float 1, match:class ^(localsend)$
windowrule = float 1, match:class ^(gnome-disks)$
windowrule = float 1, match:class ^(imv)$
windowrule = float 1, match:class ^(org.telegram.desktop)$, match:title ^(Media viewer)$
windowrule = center 1, match:class ^(org.telegram.desktop)$, match:title ^(Media viewer)$


# -----------------------------------------------------------------------------
# 9. KEY & MOUSE BINDINGS (Omarchy & Mac Native)
# -----------------------------------------------------------------------------
# Main Modifier Key (Super / Command on Mac keyboard)
$mainMod = SUPER

# --- Window Closing (Fixed: Super+W, Super+Q, Alt+F4 all work!) ---
bind = $mainMod, W,      killactive,
bind = $mainMod, Q,      killactive,
bind = ALT, F4,          killactive,

# --- Layout & Tiling (Omarchy standard: Super+T toggles float, Super+J toggles split) ---
bind = $mainMod, T,      togglefloating,
bind = $mainMod, J,      layoutmsg, togglesplit
bind = $mainMod, F,      fullscreen, 0

# --- Universal Mac / Omarchy Clipboard (Super+C = Copy, Super+V = Paste, Super+X = Cut) ---
# Sends standard Ctrl+C / Ctrl+V / Ctrl+X to active window
bind = $mainMod, C,      sendshortcut, CTRL, C, activewindow
bind = $mainMod, V,      sendshortcut, CTRL, V, activewindow
bind = $mainMod, X,      sendshortcut, CTRL, X, activewindow
bind = $mainMod, A,      sendshortcut, CTRL, A, activewindow
bind = $mainMod, Z,      sendshortcut, CTRL, Z, activewindow

# Clipboard History Manager (Super + Ctrl + V)
bind = $mainMod CTRL, V, exec, ~/.config/hypr/bin/clipboard-history.sh

# --- Applications & Basics ---
bind = $mainMod, Return,        exec, $terminal
bind = $mainMod, Space,         exec, $menu
bind = ALT, Space,              exec, $menu
bind = $mainMod, B,             exec, xdg-open http:// || firefox || chromium || zen-browser
bind = $mainMod SHIFT, Return,  exec, xdg-open http:// || firefox || chromium || zen-browser
bind = $mainMod, E,             exec, $fileManager
bind = $mainMod SHIFT, O,       exec, obsidian
bind = $mainMod CTRL, T,        exec, foot -T "Activity Monitor (btop)" -e btop
bind = $mainMod, Escape,        exec, ~/.config/hypr/bin/system-menu.sh
bind = $mainMod, L,             exec, hyprlock
bind = $mainMod SHIFT, Q,       exit,

# --- Cheatsheet & AI Agent Shortcuts ---
bind = $mainMod, K,             exec, ~/.config/hypr/bin/shortcuts-menu.sh
bind = ALT, K,                  exec, ~/.config/hypr/bin/shortcuts-menu.sh
bind = $mainMod SHIFT, A,       exec, ~/.config/hypr/bin/default-agent.sh --launch
bind = $mainMod ALT, A,         exec, ~/.config/hypr/bin/default-agent.sh --pick

# --- Music Player (Cliamp) ---
bind = $mainMod, M,             exec, foot -T "Cliamp" -e cliamp
bind = $mainMod SHIFT ALT, M,   exec, foot -T "Cliamp" -e cliamp

# --- Screenshots (Omarchy / Mac style: saves to ~/Pictures/Screenshots AND copies to clipboard) ---
# Cmd + Shift + S: Select area with mouse
bind = $mainMod SHIFT, S,       exec, ~/.config/hypr/bin/screenshot.sh area
# Cmd + Ctrl + S: Full screen capture
bind = $mainMod CTRL, S,        exec, ~/.config/hypr/bin/screenshot.sh full
# PrintScreen (if using PC keyboard)
bind = , Print,                 exec, ~/.config/hypr/bin/screenshot.sh full
bind = $mainMod, Print,         exec, ~/.config/hypr/bin/screenshot.sh area

# --- Volume & Media Controls (Mac keyboard compatible) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# --- Keyboard Window Focus Navigation ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = ALT, Tab,        cyclenext,
bind = ALT, Tab,        bringactivetotop,

# --- Workspaces 1-10 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- MOUSE CONTROLS ---
# Super + Left Click Drag = Move window
bindm = $mainMod, mouse:272, movewindow

# Super + Right Click Drag = Resize window
bindm = $mainMod, mouse:273, resizewindow

# Super + Middle Click = Toggle floating
bind = $mainMod, mouse:274, togglefloating

# Super + Scroll Wheel = Switch workspaces back and forth
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
